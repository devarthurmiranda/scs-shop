# The only shared infrastructure: path-based routing.
# Deliberately dumb. No auth, no aggregation, no business logic.
# The single non-trivial feature is SSI, which glues UI fragments
# together on the server before the browser sees them.

events {}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    ssi on;

    server {
        listen 80;

        location = / {
            return 302 /catalog;
        }

        # Shared assets: CSS only. Versioned, no logic, no shared components.
        location /assets/ {
            alias /usr/share/nginx/assets/;
        }

        location /catalog {
            proxy_set_header Accept-Encoding "";
            proxy_set_header Host $http_host;
            proxy_pass http://catalog:3000;
            proxy_intercept_errors on;
            error_page 502 503 504 = @catalog_down;
        }

        location /checkout {
            proxy_set_header Accept-Encoding "";
            proxy_set_header Host $http_host;
            proxy_pass http://checkout:3001;
        }

        location /orders {
            proxy_set_header Accept-Encoding "";
            proxy_set_header Host $http_host;
            proxy_pass http://orders:8000;
        }

        location @catalog_down {
            default_type text/html;
            return 503 '<link rel="stylesheet" href="/assets/design.css"><main><h1>Catalog is down</h1><p>Only browsing is affected. <a href="/checkout/cart">Your cart</a> and <a href="/orders/">your orders</a> still work.</p></main>';
        }
    }
}
